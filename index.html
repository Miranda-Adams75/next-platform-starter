<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GG Mascot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app">
    <img id="mascot" alt="GG mascot" src="./placeholder-mascot.png" />

    <section id="bubble" class="hidden">
      <button id="close" aria-label="Close">×</button>
      <h3 id="title">GG</h3>
      <p id="line">Come on in, sugar. Let’s build this thing.</p>
      <input id="prompt" placeholder="Type your next task..." />
      <div class="btns">
        <button>Give me a push</button>
        <button>What should I do next?</button>
        <button>Make this sell</button>
      </div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
